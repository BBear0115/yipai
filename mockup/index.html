<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#101216" />
  <title>衣拍</title>
  <link rel="stylesheet" href="styles.css?v=20261114-rounded-icons" />
  <link rel="stylesheet" href="studio.css?v=20261114-variations" />
</head>
<body>
  <div class="app-shell">
    <p class="service-mode-notice" id="service-mode-notice" role="status" hidden>演示模式：生成按钮只展示固定样例，不会处理上传图片。</p>
    <main id="app" aria-live="polite"></main>
    <nav id="dock" class="dock" aria-label="主导航">
      <div class="dock-tabs">
        <button id="create-tab" class="dock-item active" type="button" aria-label="创作" aria-current="page">
          <i class="asset-icon icon-nav-create" aria-hidden="true"></i><span class="dock-label">创作</span>
        </button>
        <button id="community-tab" class="dock-item" type="button" aria-label="社区">
          <i class="asset-icon icon-nav-community" aria-hidden="true"></i><span class="dock-label">社区</span>
        </button>
        <button id="my-tab" class="dock-item" type="button" aria-label="我的">
          <i class="asset-icon icon-nav-profile" aria-hidden="true"></i><span class="dock-label">我的</span>
        </button>
      </div>
    </nav>
    <input id="file-input" type="file" accept="image/*,.heic,.heif" multiple hidden />
    <input id="camera-input" type="file" accept="image/*" capture="environment" hidden />
    <div id="toast" class="toast" role="status"></div>
  </div>
  <script src="community.js?v=20261114-rounded-icons"></script>
  <script src="batch.js?v=20261114-picker"></script>
  <script src="studio.js?v=20261114-variations"></script>
  <script src="refine-frame.js?v=20261114-refine"></script>
  <script src="app.js?v=20261114-picker"></script>
  <script src="models.js?v=20261113-5"></script>
</body>
</html>
